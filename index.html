<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>おへやコンパス</title><meta name="description" content="Move pixels before you move furniture. 間取りと家具の悩みをなくす、お部屋づくりナビ"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head>
<body><header><div class="brand"><img src="icon.svg" width="48" height="48" alt=""><div><h1>おへやコンパス</h1><small>間取りと家具の悩みをなくす、お部屋づくりナビ</small></div></div><span id="status" role="status"></span></header>
<div class="layout"><main><div class="toolbar" id="parts"></div><div class="bar"><span id="roomCount"></span><span class="hint">移動単位</span><div class="toggle" role="group" aria-label="移動単位"><button id="mode1">1cm</button><button id="mode01">0.1cm</button></div><button id="addRoom" class="primary">＋ 部屋を追加</button></div>
<div class="bar"><button id="zoomOut" aria-label="縮小">−</button><button id="zoomReset">100%</button><button id="zoomIn" aria-label="拡大">＋</button><button id="export">配置ファイルを保存</button><button id="import">配置ファイルを開く</button><input id="importFile" type="file" accept="application/json,.json" hidden></div>
<div id="toast" hidden>部屋を削除しました <button id="undo">取り消す</button></div><div class="board" id="board"><svg id="plan" role="img" aria-label="間取りと家具・ドア・椅子のスペース"></svg></div><p class="hint">ドラッグで部屋間移動。Shiftで吸着解除。赤枠の「移動不可」で離すと元に戻ります。<br>ドアスペースは枠外にも配置可能。寸法はcm。面積は柱・欠けを除外し、1畳＝1.62㎡で換算。図は縦・横にスクロールできます。<br>iCloudで使う場合：「配置ファイルを保存」→ iCloud Driveに保存 → 別端末の「配置ファイルを開く」で読み込み。自動同期ではありません。</p></main><aside id="panel"></aside></div></body></html>
